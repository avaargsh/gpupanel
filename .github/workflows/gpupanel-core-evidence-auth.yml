name: GPUPanel Core evidence authorization
on:
  pull_request:
    paths:
      - 'core/init/router/proxy.go'
      - 'core/init/router/proxy_evidence_auth_test.go'
      - 'core/init/router/proxy_evidence_http_test.go'
      - '.github/workflows/gpupanel-core-evidence-auth.yml'
  workflow_dispatch:
jobs:
  local-evidence-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Supply CI-only embed placeholders for route unit tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p core/cmd/server/web/assets
          printf '<!doctype html><html><body>GPUPanel auth unit fixture</body></html>\n' > core/cmd/server/web/index.html
          printf 'not production assets\n' > core/cmd/server/web/assets/auth-unit-fixture.txt
      - name: Real session-cookie and denial checks at Core forwarding boundary
        working-directory: core
        run: go test ./init/router -run '^(TestCoreAppEvidenceAuthorization|TestCoreAppEvidencePathNormalization)$' -count=1 -v
      - name: Real Core proxy HTTP forwarding / nonforwarding negative tests
        working-directory: core
        run: go test ./init/router -run '^TestCoreAppEvidenceProxyHTTPGate        working-directory: core
        run: go test ./init/router -run '^__NONE__$' -count=1
 -count=1 -v
      - name: Compile Core forwarding paths
        working-directory: core
        run: go test ./init/router -run '^__NONE__$' -count=1
