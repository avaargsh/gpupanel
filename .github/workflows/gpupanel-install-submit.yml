name: GPUPanel App Store install submission
on:
  pull_request:
    paths:
      - 'frontend/apps/panel/src/**'
      - 'frontend/apps/panel/src/**'
      - 'frontend/apps/panel/src/**'
      - 'frontend/apps/panel/src/**'
      - 'frontend/apps/panel/src/**'
      - 'scripts/tests/test_gpupanel_app_install_submission.py'
      - 'scripts/tests/test_gpupanel_app_install_reload.py'
      - '.github/workflows/gpupanel-install-submit.yml'
  workflow_dispatch:
jobs:
  install-submission-contract:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install flow concurrency and failure contract
        run: python3 -m unittest discover -s scripts/tests -p 'test_gpupanel_app_install_submission.py' -v
      - name: Install reload recovery and node scope contract
        run: python3 -m unittest discover -s scripts/tests -p 'test_gpupanel_app_install_reload.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Execute browser receipt storage negative tests in Node
        run: node --experimental-strip-types --test frontend/apps/panel/src/utils/*.test.mjs
