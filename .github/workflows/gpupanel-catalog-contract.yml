name: GPUPanel Catalog contract
on:
  pull_request:
    paths:
      - 'catalog/**'
      - 'scripts/gpupanel-catalog.py'
      - 'scripts/tests/test_gpupanel_catalog.py'
      - '.github/workflows/gpupanel-catalog-contract.yml'
  workflow_dispatch:
jobs:
  catalog-contract:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m py_compile scripts/gpupanel-catalog.py scripts/tests/test_gpupanel_catalog.py
      - run: python3 -m unittest discover -s scripts/tests -p 'test_gpupanel_catalog.py' -v
      - run: python3 scripts/gpupanel-catalog.py verify
      - run: python3 scripts/gpupanel-catalog.py list
      - run: python3 -m unittest discover -s scripts/tests -p 'test_gpupanel_catalog_workspace.py' -v
      - run: |
          python3 scripts/gpupanel-catalog-workspace.py plan --help
          python3 scripts/gpupanel-catalog-workspace.py status --help
