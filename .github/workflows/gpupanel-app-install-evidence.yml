name: GPUPanel app installation evidence
on:
  pull_request:
    paths:
      - 'agent/app/service/app_install_evidence*.go'
      - 'agent/app/api/v2/app_install.go'
      - 'agent/router/ro_app.go'
      - 'agent/router/ro_app_evidence_test.go'
      - 'agent/router/ro_app_evidence_http_test.go'
      - 'scripts/tests/test_gpupanel_app_install_evidence.py'
      - 'docs/gpupanel/APP_INSTALL_EVIDENCE.md'
      - '.github/workflows/gpupanel-app-install-evidence.yml'
  workflow_dispatch:

jobs:
  read-only-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Redaction and read-only route contract
        run: python3 -m unittest discover -s scripts/tests -p 'test_gpupanel_app_install_evidence.py' -v
      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: SQLite and Docker observer evidence classification
        working-directory: agent
        run: go test ./app/service -run '^TestAppInstallEvidence' -count=1
      - name: Compile API and route bindings
        working-directory: agent
        run: go test ./app/api/v2 ./router -run '^__GPUPANEL_NONE__' -count=1
      - name: Reject remote Agent node evidence even with spoofed metadata
        working-directory: agent
        run: go test ./router -run TestAppEvidenceLocalMasterOnly -count=1 -v
      - name: Real isolated Docker state observation using Agent service
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" != 0
          docker info >/dev/null
          tmp="$(mktemp -d)"
          nonce="$(python3 -c 'import secrets; print(secrets.token_hex(8))')"
          name="gpupanel-evidence-${nonce}"
          tag="gpupanel-evidence-ci:${nonce}"
          cid=""
          cleanup() {
            result=$?
            trap - EXIT
            if [[ -n "${cid}" ]]; then
              observed="$(docker inspect --type container --format '{{.Id}} {{index .Config.Labels "io.gpupanel.evidence.nonce"}}' "${cid}" 2>/dev/null || true)"
              if [[ "${observed}" != "${cid} ${nonce}" ]]; then
                echo 'Refusing to delete container without ID + nonce ownership proof' >&2
                exit 1
              fi
              docker rm -f "${cid}" >/dev/null || exit 1
            fi
            docker image rm "${tag}" >/dev/null 2>&1 || true
            rm -rf "${tmp}"
            exit "${result}"
          }
          trap cleanup EXIT
          cat > "${tmp}/main.go" <<'EOF'
          package main
          import "time"
          func main() { time.Sleep(15 * time.Minute) }
          EOF
          (cd "${tmp}" && GO111MODULE=off CGO_ENABLED=0 go build -trimpath -o gpupanel-evidence main.go)
          printf 'FROM scratch\nCOPY gpupanel-evidence /gpupanel-evidence\n' > "${tmp}/Dockerfile"
          docker build --network none --pull=false -t "${tag}" "${tmp}" >/dev/null
          cid="$(docker create --pull=never --name "${name}" --label "io.gpupanel.evidence.nonce=${nonce}" \
            --label "com.docker.compose.project=${name}" --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 32 --memory 128m --cpus 0.5 \
            --entrypoint /gpupanel-evidence "${tag}")"
          [[ "${cid}" =~ ^[0-9a-f]{64}$ ]]
          export GPUPANEL_EVIDENCE_CONTAINER="${name}"
          docker start "${cid}" >/dev/null
          test "$(docker inspect --type container --format '{{.State.Status}}' "${cid}")" = 'running'
          (cd agent && GPUPANEL_EVIDENCE_PHASE=running go test ./app/service -run 'TestAppInstallEvidenceLiveDocker' -count=1 -v)
          (cd agent && GPUPANEL_EVIDENCE_PHASE=running go test ./router -run 'TestAppEvidenceRealHTTPAndDocker' -count=1 -v)
          docker stop -t 3 "${cid}" >/dev/null
          test "$(docker inspect --type container --format '{{.State.Status}}' "${cid}")" = 'exited'
          (cd agent && GPUPANEL_EVIDENCE_PHASE=exited go test ./app/service -run 'TestAppInstallEvidenceLiveDocker' -count=1 -v)
          (cd agent && GPUPANEL_EVIDENCE_PHASE=exited go test ./router -run 'TestAppEvidenceRealHTTPAndDocker' -count=1 -v)
