name: GPUPanel app installation evidence
on:
  pull_request:
    paths:
      - 'agent/app/service/app_install_evidence*.go'
      - 'agent/app/api/v2/app_install.go'
      - 'agent/router/ro_app.go'
      - 'scripts/tests/test_gpupanel_app_install_evidence.py'
      - '.github/workflows/gpupanel-app-install-evidence.yml'
  workflow_dispatch:

jobs:
  read-only-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Redaction and read-only route contract
        run: python3 -m unittest discover -s scripts/tests -p 'test_gpupanel_app_install_evidence.py' -v
      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: SQLite and Docker observer evidence classification
        working-directory: agent
        run: go test ./app/service -run '^TestAppInstallEvidence' -count=1
      - name: Compile API and route bindings
        working-directory: agent
        run: go test ./app/api/v2 ./router -run '^$' -count=1
