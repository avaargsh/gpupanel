name: GPUPanel native Catalog portal
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'catalog/**'
      - 'scripts/tests/test_gpupanel_native_catalog.py'
      - '.github/workflows/gpupanel-native-catalog.yml'
  workflow_dispatch:
jobs:
  native-catalog:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python3 -m unittest discover -s scripts/tests -p 'test_gpupanel_native_catalog.py' -v
      - run: npm ci
        working-directory: frontend
      - run: npm run build:pro
        working-directory: frontend
      - run: npm run type-check
        working-directory: frontend
