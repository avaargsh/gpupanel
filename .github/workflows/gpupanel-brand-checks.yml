name: GPUPanel brand checks
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/verify-brand.mjs'
      - '.github/workflows/gpupanel-brand-checks.yml'
  workflow_dispatch:
jobs:
  verify-brand:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '12.8.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: node scripts/verify-brand.mjs
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: pnpm typecheck
        working-directory: frontend
