name: GPUPanel Desktop Ubuntu Preview

on:
  pull_request:
    paths:
      - "desktop/**"
      - "profiles/ubuntu24-workstation.v1.json"
      - "scripts/gpupanel-workstation.py"
      - "scripts/gpupanel-workspace-bundle.py"
      - "scripts/tests/test_gpupanel_workstation.py"
      - "scripts/tests/test_gpupanel_workspace_bundle.py"
      - "scripts/tests/test_gpupanel_profile_transfer.py"
      - "scripts/tests/test_gpupanel_desktop_ui_contract.py"
      - ".github/workflows/gpupanel-desktop-ubuntu.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-contract:
    name: User-local profile and no-container contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python profile checks (no system changes)
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_gpupanel_workstation.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_gpupanel_workspace_bundle.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_gpupanel_profile_transfer.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_gpupanel_desktop_ui_contract.py' -v
      - name: Validate embedded frontend source
        run: node --check desktop/ui/app.js
      - name: Read-only Ubuntu doctor
        run: python3 scripts/gpupanel-workstation.py doctor > /tmp/workstation-doctor.json

  desktop-build:
    name: Wails v3 self-contained preview build (not GUI acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install native Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: false
          cache: false
      - name: Resolve Go dependencies and compile
        working-directory: desktop
        run: |
          go mod tidy
          go mod verify
          go test ./...
          go build -trimpath -o "$RUNNER_TEMP/gpupanel-desktop-preview" .
      - name: Prepare unsigned relocatable Ubuntu preview archive
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/gpupanel-desktop-preview-root"
          mkdir -p "$stage/bin" "$stage/licenses" "$stage/build"
          install -m 0755 "$RUNNER_TEMP/gpupanel-desktop-preview" "$stage/bin/gpupanel-desktop"
          install -m 0644 desktop/README.md "$stage/README.md"
          install -m 0644 desktop/go.mod desktop/go.sum "$stage/build/"
          install -m 0644 LICENSE NOTICE.md "$stage/licenses/"
          sha256sum "$stage/bin/gpupanel-desktop" > "$stage/build/binary.sha256"
          printf "source_head=%s\ncheckout_sha=%s\nplatform=ubuntu-24.04-amd64\nstatus=UNSIGNED_PREVIEW_NOT_RELEASED\n" \
            "${{ github.event.pull_request.head.sha || github.sha }}" "$(git rev-parse HEAD)" \
            > "$stage/build/provenance.txt"
          archive="$RUNNER_TEMP/gpupanel-desktop-preview-ubuntu24-amd64.tar.gz"
          tar -czf "$archive" -C "$stage" .
          sha256sum "$archive" > "$archive.sha256"
          tar -tzf "$archive" >/dev/null
      - name: Upload checksumed source-preview binary (no release)
        uses: actions/upload-artifact@v4
        with:
          name: gpupanel-desktop-ubuntu24-amd64-preview
          path: |
            ${{ runner.temp }}/gpupanel-desktop-preview-ubuntu24-amd64.tar.gz
            ${{ runner.temp }}/gpupanel-desktop-preview-ubuntu24-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Clarify acceptance status
        run: |
          echo "Unsigned preview archive uploaded with SHA-256; contents are not a published package."
          echo "CLI-only embedded Python check runs in Go tests without a source checkout."
          echo "No native GUI, Polkit install, full offline restore, Docker/provider or production release acceptance ran."
