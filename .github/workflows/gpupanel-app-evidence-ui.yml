name: GPUPanel read-only installed app evidence UI
on:
  pull_request:
    paths:
      - 'frontend/src/views/app-store/installed/evidence/**'
      - 'frontend/src/views/app-store/installed/index.vue'
      - 'frontend/src/api/modules/app.ts'
      - 'frontend/src/api/interface/app.ts'
      - 'frontend/src/lang/modules/en.ts'
      - 'frontend/src/lang/modules/zh.ts'
      - '.github/workflows/gpupanel-app-evidence-ui.yml'
  workflow_dispatch:
jobs:
  local-evidence-drawer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Execute false-verification, redaction and schema rejection cases
        run: node --experimental-strip-types --test frontend/src/views/app-store/installed/evidence/evidence.test.mjs
      - run: npm ci
        working-directory: frontend
      - run: npm run type-check
        working-directory: frontend
      - run: npm run build:pro
        working-directory: frontend
