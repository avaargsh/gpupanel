name: GPUPanel Host portal
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/tests/test_gpupanel_portal.py'
      - '.github/workflows/gpupanel-portal-checks.yml'
  workflow_dispatch:
jobs:
  host-portal:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '12.8.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts/tests -p 'test_gpupanel_portal.py' -v
      - run: python3 -m unittest discover -s scripts/tests -p 'test_gpupanel_workstation_shell.py' -v
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      # React workspace tests; integrated UI flows run in the mainline browser job.
      - run: pnpm test
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: pnpm typecheck
        working-directory: frontend
