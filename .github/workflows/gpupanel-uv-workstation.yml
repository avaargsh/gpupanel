name: GPUPanel uv workstation environment
on:
  pull_request:
    paths:
      - 'scripts/gpupanel-env.py'
      - 'scripts/gpupanel-uv-project.py'
      - 'scripts/gpupanel-uv-intent-runner.py'
      - 'scripts/gpupanel-uv-user-worker.py'
      - 'scripts/tests/test_gpupanel_uv_user_worker.py'
      - 'scripts/tests/test_gpupanel_uv_intent_runner.py'
      - 'scripts/gpupanel-uv-lock-check.py'
      - 'scripts/tests/test_gpupanel_uv_lock_check.py'
      - 'scripts/tests/test_gpupanel_uv_project.py'
      - 'scripts/gpupanel-env-packages.py'
      - 'scripts/tests/test_gpupanel_env_packages.py'
      - 'scripts/tests/test_gpupanel_env.py'
      - 'scripts/gpupanel-catalog-workspace.py'
      - '.github/workflows/gpupanel-uv-workstation.yml'
  workflow_dispatch:
jobs:
  uv-environment:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.10.0'
      - run: uv --version
      - run: python3 -m py_compile scripts/gpupanel-env.py scripts/tests/test_gpupanel_env.py
      - run: python3 -m unittest discover -s scripts/tests -p 'test_gpupanel_env.py' -v
      - run: python3 -m unittest discover -s scripts/tests -p 'test_gpupanel_env_packages.py' -v
      - run: python3 scripts/gpupanel-env.py plan
      - run: python3 scripts/gpupanel-env.py plan --json
      - run: python3 -m py_compile scripts/gpupanel-uv-project.py scripts/tests/test_gpupanel_uv_project.py
      - run: python3 -m unittest discover -s scripts/tests -p 'test_gpupanel_uv_project.py' -v
      - run: python3 scripts/gpupanel-uv-project.py plan
      - run: python3 scripts/gpupanel-uv-project.py plan --json
      - run: python3 -m py_compile scripts/gpupanel-uv-intent-runner.py scripts/tests/test_gpupanel_uv_intent_runner.py
      - run: python3 -m unittest discover -s scripts/tests -p 'test_gpupanel_uv_intent_runner.py' -v
      - run: python3 -m py_compile scripts/gpupanel-uv-user-worker.py scripts/tests/test_gpupanel_uv_user_worker.py
      - run: python3 -m unittest discover -s scripts/tests -p 'test_gpupanel_uv_user_worker.py' -v
      - run: python3 -m py_compile scripts/gpupanel-uv-lock-check.py scripts/tests/test_gpupanel_uv_lock_check.py
      - run: python3 -m unittest discover -s scripts/tests -p 'test_gpupanel_uv_lock_check.py' -v
