name: GPUPanel OS principal primitive tests

on:
  push:
    branches:
      - 'feat/**'
    paths:
      - 'scripts/gpupanel_os_principal.py'
      - 'scripts/tests/test_gpupanel_os_principal.py'
      - '.github/workflows/gpupanel-os-principal-tests.yml'
  pull_request:
    branches: [main, dev-v2]
    paths:
      - 'scripts/gpupanel_os_principal.py'
      - 'scripts/tests/test_gpupanel_os_principal.py'
      - '.github/workflows/gpupanel-os-principal-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os-principal-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  peer-credential-unit-tests:
    name: peer-credential-unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run fail-closed peer credential tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_gpupanel_os_principal.py' -v
