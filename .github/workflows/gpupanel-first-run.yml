name: GPUPanel first-run portal
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/tests/test_gpupanel_first_run.py'
      - '.github/workflows/gpupanel-first-run.yml'
  workflow_dispatch:
jobs:
  first-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts/tests -p 'test_gpupanel_first_run.py' -v
      - run: npm ci
        working-directory: frontend
      - run: npm run build:pro
        working-directory: frontend
      - run: npm run type-check
        working-directory: frontend
