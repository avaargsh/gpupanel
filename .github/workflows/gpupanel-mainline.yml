name: GPUPanel mainline baseline
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mainline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - run: python3 -m unittest discover -s scripts/tests -p 'test_gpupanel_*.py' -v
  frontend-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '12.8.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      # React workspace: compile, validate recovery helpers, then simulated browser flows.
      - run: pnpm build
        working-directory: frontend
      - run: pnpm typecheck
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
  backend-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.sum
            agent/go.sum
      - name: CI-only embed fixtures (not release assets)
        run: |
          mkdir -p core/cmd/server/web/assets
          printf '<html>CI test fixture</html>\n' > core/cmd/server/web/index.html
          printf 'CI test fixture\n' > core/cmd/server/web/assets/fixture.txt
      - name: Core package tests, including session and real HTTP denial
        working-directory: core
        run: go test ./... -count=1 -timeout=120s
      - name: Agent package tests, including admission, UNKNOWN, socket, migration and exact-name matching
        working-directory: agent
        run: go test ./... -count=1 -timeout=120s
      - run: go build -o /tmp/gpupanel-core ./cmd/server
        working-directory: core
      - run: go build -o /tmp/gpupanel-agent ./cmd/server
        working-directory: agent

  browser-negatives-on-demand:
    # Chromium remains a TEST/RELEASE gate, not a normal DEV PR job.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '12.8.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - name: Simulated API browser negative controls (not live Host acceptance)
        run: python scripts/browser/run-react-tests.py
