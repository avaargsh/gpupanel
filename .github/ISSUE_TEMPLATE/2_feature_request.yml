name: "GPUPanel Feature Request"
description: "Propose a user outcome, not just an extra menu or dependency"
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        GPUPanel prioritizes personal Ubuntu Host → enterprise Host → optional GPU/Kubernetes/AI integrations.
        Prefer adopting mature upstream tools before inventing new runtimes.
  - type: dropdown
    id: audience
    attributes:
      label: "Primary user"
      options:
        - "Individual Ubuntu developer"
        - "Host administrator / SRE"
        - "AI developer"
        - "Platform administrator"
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: "Real workflow and pain point"
      description: "What were you trying to do? Where did your existing workflow fail?"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Existing alternatives"
      description: "Examples: upstream 1Panel, MLflow, OpenShift AI, ZenML, Kueue, CLI, existing scripts."
    validations:
      required: true
  - type: textarea
    id: minimal
    attributes:
      label: "Smallest valuable outcome / acceptance test"
      description: "How can another user independently demonstrate the benefit?"
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: "Constraints and risks"
      description: "Offline network, compatibility, permissions, hardware, migrations, licenses."
