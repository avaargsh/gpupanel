name: "GPUPanel Bug Report"
description: "Report a reproducible GPUPanel defect (no secrets or exploit details)"
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Please search for duplicates first. This is the GPUPanel fork, not the official 1Panel support channel.
        **Never paste passwords, access tokens, public/private IPs, customer data or exploitable security details here.**
        For vulnerabilities, read SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: "GPUPanel version / commit SHA"
      description: "Use the git commit hash if running from source. Do not guess a release number."
      placeholder: "e.g. git rev-parse --short HEAD"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: "Affected area"
      options:
        - "Ubuntu Bootstrap / offline bundle"
        - "Host / files / terminal / network"
        - "Docker / Apps"
        - "GPU monitoring / provider"
        - "Portal / authorization / UI"
        - "Kubernetes / AI integration (development)"
        - "Build / installation / documentation"
        - "Other"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "Sanitized environment"
      description: "OS/version, browser, architecture, container/host; omit identifying data."
      placeholder: "Ubuntu 24.04, x86_64, Firefox"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: "Steps to reproduce"
      description: "A minimal and safe reproduction, with dummy/test data."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual behavior"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Sanitized error output / screenshots"
      description: "Prefer short snippets. Remove tokens, credentials, IPs, serial numbers, customer data."
      render: shell
  - type: checkboxes
    id: redaction
    attributes:
      label: "Safety check"
      options:
        - label: "I have removed secrets and identifying information, and this report does not disclose an unpatched vulnerability."
          required: true
